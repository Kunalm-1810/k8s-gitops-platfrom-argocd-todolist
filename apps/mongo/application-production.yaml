apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongo-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Kunalm-1810/k8s-manifest-deployment-repo-todolist.git
    targetRevision: main
    path: charts/mongo
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
        
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:  
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true