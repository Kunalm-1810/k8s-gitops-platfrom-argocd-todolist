apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-gitops-bootloader
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kunalm-1810/k8s-gitops-platfrom-argocd-todolist.git
    targetRevision: HEAD
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true